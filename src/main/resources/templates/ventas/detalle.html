<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Detalle de venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-caffeto">
        <div class="card-body p-4">
            <div class="d-flex justify-content-between flex-wrap gap-2 mb-3">
                <h1 class="titulo-seccion h4 mb-0">Venta #<span th:text="${venta.id}">1</span></h1>
                <span class="text-muted" th:text="${#temporals.format(venta.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026</span>
            </div>
            <p class="mb-4"><strong>Cliente:</strong> <span th:text="${venta.cliente}">Cliente general</span></p>

            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr><th>Producto</th><th class="text-center">Cantidad</th><th class="text-end">P. unitario</th><th class="text-end">Subtotal</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="d : ${venta.detalles}">
                            <td th:text="${d.producto.nombre}">Espresso</td>
                            <td class="text-center" th:text="${d.cantidad}">2</td>
                            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.precioUnitario, 1, 'COMMA', 2, 'POINT')}">S/ 6.50</td>
                            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(d.subtotal, 1, 'COMMA', 2, 'POINT')}">S/ 13.00</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <tr>
                            <th colspan="3" class="text-end">Total</th>
                            <th class="text-end fs-5" style="color: var(--cafe-oscuro)"
                                th:text="'S/ ' + ${#numbers.formatDecimal(venta.total, 1, 'COMMA', 2, 'POINT')}">S/ 13.00</th>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a th:href="@{/ventas}" class="btn btn-outline-secondary">Volver al historial</a>
                <a th:href="@{/ventas/nueva}" class="btn btn-caffeto">Nueva venta</a>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
