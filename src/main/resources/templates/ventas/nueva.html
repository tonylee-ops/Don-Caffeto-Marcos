<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nueva venta')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="titulo-seccion h3 mb-3">Nueva venta</h1>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <form th:action="@{/ventas/guardar}" method="post">
        <div class="card card-caffeto mb-3">
            <div class="card-body">
                <label for="cliente" class="form-label fw-semibold">Cliente (opcional)</label>
                <input type="text" id="cliente" name="cliente" class="form-control" maxlength="80"
                       placeholder="Cliente general">
            </div>
        </div>

        <div class="card card-caffeto">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr><th>Producto</th><th>Categoría</th><th class="text-end">Precio</th><th class="text-center">Stock</th><th style="width:130px">Cantidad</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${productos}">
                            <td class="fw-semibold" th:text="${p.nombre}">Espresso</td>
                            <td th:text="${p.categoria.nombre}">Cafés</td>
                            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 6.50</td>
                            <td class="text-center" th:text="${p.stock}">10</td>
                            <td>
                                <input type="number" min="0" th:max="${p.stock}" value="0" class="form-control form-control-sm"
                                       th:name="'cantidad_' + ${p.id}">
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productos)}">
                            <td colspan="5" class="text-center text-muted">No hay productos activos. Registre productos primero.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="d-flex justify-content-end gap-2 mt-3">
            <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-caffeto">Registrar venta</button>
        </div>
    </form>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
