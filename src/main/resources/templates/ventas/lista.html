<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Ventas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="titulo-seccion h3 mb-0">Historial de ventas</h1>
        <a class="btn btn-caffeto" th:href="@{/ventas/nueva}">+ Nueva venta</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-caffeto">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr><th>#</th><th>Fecha</th><th>Cliente</th><th class="text-center">Ítems</th><th class="text-end">Total</th><th></th></tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${ventas}">
                        <td th:text="${v.id}">1</td>
                        <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                        <td th:text="${v.cliente}">Cliente general</td>
                        <td class="text-center" th:text="${#lists.size(v.detalles)}">2</td>
                        <td class="text-end fw-semibold" th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                        <td class="text-end"><a th:href="@{/ventas/{id}(id=${v.id})}" class="btn btn-sm btn-outline-caffeto">Ver</a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventas)}">
                        <td colspan="6" class="text-center text-muted">Todavía no hay ventas registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
