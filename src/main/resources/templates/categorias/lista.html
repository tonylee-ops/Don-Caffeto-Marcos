<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categorías')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="titulo-seccion h3 mb-0">Categorías</h1>
        <a class="btn btn-caffeto" th:href="@{/categorias/nueva}">+ Nueva categoría</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="card card-caffeto">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead>
                    <tr><th>Nombre</th><th>Descripción</th><th>Productos</th><th class="text-end">Acciones</th></tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${categorias}">
                        <td class="fw-semibold" th:text="${c.nombre}">Cafés</td>
                        <td th:text="${c.descripcion}">Descripción</td>
                        <td th:text="${#lists.size(c.productos)}">0</td>
                        <td class="text-end">
                            <a th:href="@{/categorias/{id}/editar(id=${c.id})}" class="btn btn-sm btn-outline-caffeto">Editar</a>
                            <form th:action="@{/categorias/{id}/eliminar(id=${c.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('¿Eliminar esta categoría?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Eliminar</button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categorias)}">
                        <td colspan="4" class="text-center text-muted">No hay categorías registradas.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
