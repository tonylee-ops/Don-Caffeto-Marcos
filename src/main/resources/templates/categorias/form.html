<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Categoría')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-caffeto">
                <div class="card-body p-4">
                    <h1 class="titulo-seccion h4 mb-4" th:text="${categoria.id == null} ? 'Nueva categoría' : 'Editar categoría'">Categoría</h1>

                    <form th:action="@{/categorias/guardar}" th:object="${categoria}" method="post" novalidate>
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label for="nombre" class="form-label fw-semibold">Nombre</label>
                            <input type="text" id="nombre" th:field="*{nombre}" class="form-control"
                                   th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" maxlength="60">
                            <div class="invalid-feedback" th:errors="*{nombre}">Error</div>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label fw-semibold">Descripción</label>
                            <textarea id="descripcion" th:field="*{descripcion}" rows="3" class="form-control"
                                      th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'" maxlength="200"></textarea>
                            <div class="invalid-feedback" th:errors="*{descripcion}">Error</div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a th:href="@{/categorias}" class="btn btn-outline-secondary">Cancelar</a>
                            <button type="submit" class="btn btn-caffeto">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
