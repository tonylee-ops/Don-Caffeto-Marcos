<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Inicio')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="titulo-seccion mb-4">Resumen de la cafetería</h1>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card card-caffeto indicador p-3 h-100">
                <div class="text-muted small">Total vendido</div>
                <div class="valor" th:text="'S/ ' + ${#numbers.formatDecimal(totalVendido, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card card-caffeto indicador p-3 h-100">
                <div class="text-muted small">Ventas registradas</div>
                <div class="valor" th:text="${cantidadVentas}">0</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card card-caffeto indicador p-3 h-100">
                <div class="text-muted small">Productos en el menú</div>
                <div class="valor" th:text="${cantidadProductos}">0</div>
            </div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card card-caffeto indicador p-3 h-100">
                <div class="text-muted small">Stock bajo (5 o menos)</div>
                <div class="valor" th:text="${productosStockBajo}">0</div>
            </div>
        </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mb-4">
        <a class="btn btn-caffeto" th:href="@{/ventas/nueva}">+ Nueva venta</a>
        <a class="btn btn-outline-caffeto" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
        <a class="btn btn-outline-caffeto" th:href="@{/categorias/nueva}">+ Nueva categoría</a>
    </div>

    <div class="card card-caffeto">
        <div class="card-body">
            <h2 class="h5 titulo-seccion">Últimas ventas</h2>
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead>
                        <tr><th>#</th><th>Fecha</th><th>Cliente</th><th class="text-end">Total</th><th></th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="v : ${ultimasVentas}">
                            <td th:text="${v.id}">1</td>
                            <td th:text="${#temporals.format(v.fecha, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
                            <td th:text="${v.cliente}">Cliente</td>
                            <td class="text-end" th:text="'S/ ' + ${#numbers.formatDecimal(v.total, 1, 'COMMA', 2, 'POINT')}">S/ 0.00</td>
                            <td class="text-end"><a th:href="@{/ventas/{id}(id=${v.id})}" class="btn btn-sm btn-outline-caffeto">Ver</a></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ultimasVentas)}">
                            <td colspan="5" class="text-center text-muted">Todavía no hay ventas registradas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
