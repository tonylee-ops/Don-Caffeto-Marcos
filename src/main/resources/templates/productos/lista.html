<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Productos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="titulo-seccion h3 mb-0">Productos del menú</h1>
        <a class="btn btn-caffeto" th:href="@{/productos/nuevo}">+ Nuevo producto</a>
    </div>

    <div th:replace="~{fragments/layout :: mensajes}"></div>

    <div class="row g-3">
        <div class="col-12 col-md-6 col-xl-4" th:each="p : ${productos}">
            <div class="card card-caffeto producto-tarjeta h-100" th:classappend="${!p.activo} ? 'opacity-50'">
                <div class="card-body d-flex flex-column">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="h5 mb-0" th:text="${p.nombre}">Espresso</h2>
                        <span class="badge bg-secondary" th:text="${p.categoria.nombre}">Cafés</span>
                    </div>
                    <p class="text-muted small flex-grow-1" th:text="${p.descripcion}">Descripción</p>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-5 fw-bold" style="color: var(--cafe-oscuro)"
                              th:text="'S/ ' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">S/ 6.50</span>
                        <span class="badge" th:classappend="${p.stock <= 5} ? 'badge-stock-bajo' : 'bg-success'"
                              th:text="'Stock: ' + ${p.stock}">Stock: 10</span>
                    </div>
                    <div class="d-flex gap-2">
                        <a th:href="@{/productos/{id}/editar(id=${p.id})}" class="btn btn-sm btn-outline-caffeto">Editar</a>
                        <form th:if="${p.activo}" th:action="@{/productos/{id}/desactivar(id=${p.id})}" method="post"
                              onsubmit="return confirm('¿Desactivar este producto?');">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">Desactivar</button>
                        </form>
                        <span th:unless="${p.activo}" class="badge bg-dark align-self-center">Inactivo</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12" th:if="${#lists.isEmpty(productos)}">
            <p class="text-center text-muted">No hay productos registrados.</p>
        </div>
    </div>
</main>

<script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
