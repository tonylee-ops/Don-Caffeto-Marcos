spring.application.name=don-caffeto

# Base de datos MySQL (ajustar usuario y clave en cada equipo)
spring.datasource.url=jdbc:mysql://localhost:3306/don_caffeto_marcos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA: Hibernate crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=false

# Formato de moneda y zona horaria
spring.jackson.time-zone=America/Lima
